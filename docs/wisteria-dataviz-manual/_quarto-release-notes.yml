project:
  type: default
  output-dir: "docs"
toc: false
number-sections: false
execute:
  eval: true
default:
  subtitle: Release Notes
  description: Release Notes
  article: index.qmd
  engine: knitr
format:
  pdf:
    documentclass: scrartcl
    template: latex/default.tex
    include-in-header: latex/preamble.tex
    latex-engine: xelatex
    keep-tex: true
    lot: false
    code-block-bg: false
    output-file: "release-notes"
    CJKmainfont: NotoSerifJP
    CJKoptions:
      - Path=./fonts/NotoSerifJP/
      - Extension=.ttf
      - UprightFont=*-VariableFontwght
    mainfont: Inter
    mainfontoptions:
      - Path=./fonts/Inter/
      - Extension=.ttf
      - UprightFont=Inter-VariableFontopszwghtt
      - ItalicFont=Inter-ItalicVariableFontopszwght
      - BoldFont=Inter-18pt-Bold
      - BoldItalicFont=Inter-18pt-BoldItalic
    monofont: Inconsolata
    monofontoptions:
      - Path=./fonts/Inconsolata/
      - Extension=.ttf
      - UprightFont=Inconsolata-VariableFontwdthwght
      - ItalicFont=Inconsolata-VariableFontwdthwght
